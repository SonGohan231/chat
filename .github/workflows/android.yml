name: Android APK

on:
  push:
    branches: [main, questgpt-live-edit-v3, questgpt-wireless-adb-v1]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk QuestGPT.apk
      - uses: actions/upload-artifact@v4
        with:
          name: questgpt-apk-${{ github.run_number }}
          path: QuestGPT.apk
      - name: Publish self-update release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: questgpt-${{ github.run_number }}
          name: QuestGPT build ${{ github.run_number }}
          make_latest: true
          files: QuestGPT.apk
