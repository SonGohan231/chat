name: QuestGPT 2 - build and Android tests
on:
  push:
    branches: ['rebuild/questgpt2-*']
    paths: ['reborn/**', '.github/workflows/questgpt2.yml', '*.gradle.kts', 'gradle.properties']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build and protocol tests
        run: gradle :reborn:testDebugUnitTest :reborn:assembleDebug :reborn:assembleRelease :reborn:lintDebug --stacktrace
      - name: Prepare unsigned release for private signing
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -P 16 -f 4 reborn/build/outputs/apk/release/reborn-release-unsigned.apk QuestGPT-2-aligned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: QuestGPT-2-unsigned-apk
          path: |
            QuestGPT-2-aligned.apk
            apksigner.jar
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native Android smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_c
          disable-animations: true
          script: bash scripts/test-questgpt2.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: QuestGPT-2-test-evidence
          path: |
            screenshots/
            reborn/build/reports/
            reborn/build/outputs/androidTest-results/
